<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>DOM-практика: Список задач</title>
  <style>
    body { font-family: sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; transition: 0.2s; }
    body.dark { background: #1e293b; color: #f8fafc; }
    .controls { display: flex; gap: 8px; margin: 16px 0; }
    input { flex: 1; padding: 8px; }
    button { padding: 8px 12px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #cbd5e1; }
    .task-text { cursor: pointer; }
    .done .task-text { text-decoration: line-through; opacity: 0.55; }
  </style>
  <script src="script.js" defer></script>
</head>
<body>
  <button id="theme-btn">Сменить тему</button>
  <h1>Мои задачи (<span id="counter">0</span>)</h1>

  <div class="controls">
    <input id="task-input" type="text" placeholder="Введите задачу...">
    <button id="add-btn">Добавить</button>
  </div>

  <ul id="task-list"></ul>
</body>
</html>
